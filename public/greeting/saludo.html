<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saludo</title>
<style>
/* ===== Saludo animado — HTML + CSS =====
   Ajustes rápidos en .saludo:
   --ancho : tamaño del bloque
   --fondo : color de fondo (transparent por defecto; ej. #feeb03 para el amarillo)
   --dur   : duración de la animación
   --veces : número de repeticiones (1 = una vez, infinite = en bucle)          */
html,body{margin:0;height:100%}
body{display:grid;place-items:end start;background:transparent}
.saludo{
  --ancho:min(80vw,80vh*1240/1514); --fondo:transparent; --dur:2.0s; --veces:1;
  position:relative; width:var(--ancho); aspect-ratio:1240/1514;
  background:var(--fondo); overflow:hidden; cursor:pointer;
  -webkit-tap-highlight-color:transparent; contain:paint;
}
.saludo *{position:absolute; box-sizing:border-box}
.saludo .rig{left:6.6129%;top:7.3976%;width:90.4839%;height:103.1704%;transform-origin:55.258% 57.618%;
  transform:translateY(120%)}
.saludo .layer,.saludo .grp{left:0;top:0;width:100%;height:100%}
.saludo img.layer{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.saludo .head{transform-origin:54.991% 47.695%}
.saludo .forearm{transform-origin:13.369% 79.706%}
.saludo .hand{transform-origin:18.717% 53.265%}
.saludo .eye{border-radius:50%;overflow:hidden}
.saludo .pupil{border-radius:50%;background:#121014}
.saludo .lid{left:-2%;width:104%;background:rgb(198,115,78)}
.saludo .lid.t{top:-2%;height:57%;border-radius:0 0 50% 50%/0 0 38% 38%;
  background:linear-gradient(to top,#111 0 10%,rgb(198,115,78) 10%);transform:translateY(-101%)}
.saludo .lid.b{bottom:-2%;height:47%;transform:translateY(101%)}
.saludo svg.pop{left:0;top:0;width:100%;height:100%;overflow:visible}
.saludo svg.pop line{stroke:#121214;stroke-width:15;stroke-linecap:round;fill:none;
  stroke-dasharray:0.0001 2;opacity:0;transform-box:view-box}
/* --- animación --- */
.saludo.play .rig    {animation:rig var(--dur) linear var(--veces) both}
.saludo.play .head   {animation:head var(--dur) linear var(--veces) both}
.saludo.play .forearm{animation:forearm var(--dur) linear var(--veces) both}
.saludo.play .hand   {animation:hand var(--dur) linear var(--veces) both}
.saludo.play .pupil  {animation:look var(--dur) linear var(--veces) both}
.saludo.play .lid.t  {animation:lidT var(--dur) linear var(--veces) both}
.saludo.play .lid.b  {animation:lidB var(--dur) linear var(--veces) both}
.saludo.play .p0{animation:pop0 var(--dur) linear var(--veces) both}.saludo.play .p1{animation:pop1 var(--dur) linear var(--veces) both}.saludo.play .p2{animation:pop2 var(--dur) linear var(--veces) both}
@media (prefers-reduced-motion:reduce){
  .saludo .rig{transform:none!important;animation:none!important}
  .saludo.play *{animation:none!important}
}
